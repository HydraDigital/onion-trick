<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personalized Hair Care Assessment</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#282535;background:#f9f6f1}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #eee;padding:16px;text-align:center;font-weight:800;letter-spacing:.4px}header span{color:#6651cc}.wrap{max-width:470px;margin:auto;padding:26px 20px 45px;text-align:center}.progress{height:7px;background:#e9e4ee;border-radius:20px;margin:10px 0 28px;overflow:hidden}.progress div{height:100%;background:#7658d8;transition:width .3s}small{color:#827b89;font-size:12px}h1{font-size:25px;line-height:1.22;margin:15px 0;font-weight:800}p{line-height:1.6;color:#686270;font-size:15px}.hero{width:100%;max-height:270px;object-fit:cover;border-radius:12px;margin:12px 0 18px}.option{width:100%;display:block;border:1px solid #e7e0e9;background:#fff;border-radius:9px;padding:16px;text-align:left;margin:11px 0;cursor:pointer;font-size:15px;color:#302c36;transition:.15s}.option:hover,.option.selected{border-color:#7459d5;background:#f1edff}.option:before{content:'○';color:#8068ce;margin-right:12px}.option.selected:before{content:'●'}.primary{background:#6b56cc;color:white;border:0;border-radius:9px;padding:17px;width:100%;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}.primary:disabled{opacity:.45;cursor:not-allowed}.back{background:none;border:0;color:#817a89;margin-top:18px;cursor:pointer}.video{background:#16151a;aspect-ratio:9/16;max-height:550px;margin:15px auto;width:min(100%,310px);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;padding:22px}.video svg{width:56px}.tag{color:#6b4ac9;font-weight:800}.loading{height:12px;background:#e9e5eb;border-radius:20px;overflow:hidden}.loading div{height:100%;background:#7458cf;animation:load 3s forwards}@keyframes load{from{width:0}to{width:100%}}.price{font-size:36px;font-weight:900;color:#29243b}.card{background:#fff;padding:23px;border-radius:14px;box-shadow:0 6px 30px #26153b13}.green{background:#799486}.muted{font-size:12px}.step{font-weight:700;color:#7458cf}</style></head><body><header>HAIR <span>ASSESSMENT</span></header><main class="wrap" id="app"></main><script>
const questions=[
{title:"Find out what your hair needs to look fuller and healthier",subtitle:"Take this quick assessment to discover a personalized hair care routine.",intro:true},
{title:"What bothers you most about your hair?",options:["Excessive hair shedding","Thinning hair or visible scalp","Slow hair growth","Weak, brittle or damaged hair","Several of these concerns"]},
{title:"How long have you been experiencing hair problems?",options:["Less than 3 months","3 to 6 months","6 to 12 months","More than a year"]},
{title:"How would you describe your hair today?",options:["Thin and fragile","Dry and brittle","Oily at the roots","Normal but shedding","I'm not sure"]},
{title:"Which area of your scalp is most affected?",options:["Hairline or temples","Top of my head","All over my scalp","I haven't noticed specific areas"]},
{title:"What do you think triggered your hair changes?",options:["Stress or emotional changes","Hormonal changes","After pregnancy","Age-related changes","I don't know"]},
{title:"How old are you?",options:["Under 30","30–39","40–49","50–59","60 or older"]},
{title:"What is your main goal?",options:["Reduce hair shedding","Support healthy hair growth","Improve fullness and volume","Make my hair stronger and healthier"]},
{title:"Have you tried any hair treatments before?",options:["Yes, but they didn't work for me","Yes, with temporary results","No, this will be my first","I'm currently using one"]},
{title:"How much time can you dedicate to your hair care routine?",options:["5 minutes a day","10–15 minutes a day","As much as needed"]},
{title:"Are you ready to start a personalized hair care routine?",options:["Yes, I'm ready!","I'd like to learn more first"]}];
let index=0,answers={},selected=null;const app=document.getElementById('app');
function render(){window.scrollTo(0,0);let q=questions[index],pct=Math.round(index/(questions.length+3)*100);let top='<small>PERSONALIZED HAIR ANALYSIS</small><div class="progress"><div style="width:'+pct+'%"></div></div>';
if(index===0){app.innerHTML=top+'<h1>'+q.title+'</h1><p>'+q.subtitle+'</p><img class="hero" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800&auto=format&fit=crop" alt="Woman with healthy hair"><button class="primary" onclick="next()">START MY ASSESSMENT →</button><p class="muted">Takes about 2 minutes · Free assessment</p>';return}
if(index<questions.length){selected=answers[index]??null;app.innerHTML=top+'<small>QUESTION '+index+' OF '+(questions.length-1)+'</small><h1>'+q.title+'</h1>'+q.options.map((o,i)=>'<button class="option '+(selected===i?'selected':'')+'" onclick="choose('+i+')">'+o+'</button>').join('')+'<button class="primary" id="next" '+(selected===null?'disabled':'')+' onclick="next()">CONTINUE →</button><button class="back" onclick="back()">← Previous question</button>';return}
if(index===questions.length){app.innerHTML=top+'<h1>We’re preparing your personalized hair care plan!</h1><p>Based on your answers, we’re organizing a routine focused on your main hair concerns.</p><div class="loading"><div></div></div><p>Analyzing your answers…</p>';setTimeout(()=>{if(index===questions.length){index++;render()}},3200);return}
if(index===questions.length+1){app.innerHTML=top+'<div class="step">YOUR PERSONALIZED RESULTS</div><h1>Discover your personalized hair care routine</h1><p>We have prepared a simple, step-by-step routine based on your responses. Watch this introduction to learn what is included.</p><div class="video"><div><svg viewBox="0 0 64 64" fill="white"><path d="M21 12v40l33-20z"/></svg><p style="color:white">Your introduction video</p><small>Video source not provided</small></div></div><button class="primary green" onclick="next()">CONTINUE TO MY PLAN →</button>';return}
app.innerHTML=top+'<div class="card"><div class="step">YOUR PERSONALIZED PLAN IS READY</div><h1>Your 3-Step Hair Care Routine</h1><p>Discover a straightforward routine designed to support scalp care, stronger-looking hair and consistent daily habits.</p><div style="text-align:left"><p>✓ Step 1: Scalp care and cleansing</p><p>✓ Step 2: Hair strengthening routine</p><p>✓ Step 3: Ongoing care and progress tracking</p></div><p class="muted">Your plan is educational and results vary. It is not a medical treatment.</p><button class="primary green" onclick="showCheckoutNotice()">GET MY PERSONALIZED PLAN →</button></div>'}
function showCheckoutNotice(){alert("Checkout integration is not configured yet.")}function choose(i){answers[index]=i;render()}function next(){index++;render()}function back(){if(index>0)index--;render()}render();
</script></body></html>
